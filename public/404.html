<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Visali Designer Ledger</title>
  <script type="text/javascript">
    // GitHub Pages has no server-side rewrites, so a direct visit or
    // refresh on a route like /orders 404s here. Re-encode the path into
    // a query string and redirect to index.html, which decodes it back
    // via history.replaceState before React Router ever sees it.
    // pathSegmentsToKeep = 1 for the /Visali_CRM/ project-page prefix.
    var pathSegmentsToKeep = 1
    var l = window.location
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    )
  </script>
</head>
<body></body>
</html>
